<style>
  html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh*9/16));width:min(100vw,calc(100dvh*9/16));
    aspect-ratio:9/16;font-family:'Press Start 2P',monospace;font-size:9px;overflow:hidden;background:#0d1230}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:.15em .15em 0 #000}
  button{pointer-events:auto;font-family:inherit;font-size:1em;color:#fff;background:#24305e;border:0;padding:.8em .9em;
    box-shadow:inset -.25em -.25em 0 #0006,inset .25em .25em 0 #fff3,0 0 0 .2em #000;cursor:pointer;text-shadow:.12em .12em 0 #000}
  button:active{transform:translateY(.15em)}
  #msg{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:2.6em;opacity:0;transform:scale(.4);
    transition:transform .25s cubic-bezier(.3,1.8,.5,1),opacity .2s;text-shadow:.12em .12em 0 #000,-.06em -.06em 0 #000}
  #msg.show{opacity:1;transform:scale(1)}
  #msg small{display:block;font-size:.32em;margin-top:.9em;color:#fff}
  /* dica do primeiro chute: seta em pixel art balançando em cima do botão de chutar */
  #tip{position:absolute;left:50%;z-index:5;display:none;flex-direction:column;align-items:center;gap:.5em;pointer-events:none;
    color:#ffd84d;font-size:1.15em;transform:translateX(-50%);animation:bob .45s steps(2) infinite alternate}
  #tip.show{display:flex}
  #tip svg{width:3.6em;height:3.6em;shape-rendering:crispEdges;
    filter:drop-shadow(.18em 0 0 #000) drop-shadow(-.18em 0 0 #000) drop-shadow(0 .18em 0 #000) drop-shadow(0 -.18em 0 #000)}
  /* dica de mira: mãozinha em pixel art deslizando de um lado para o outro */
  #aimtip{position:absolute;left:50%;top:50%;z-index:5;display:none;flex-direction:column;align-items:center;gap:.7em;pointer-events:none;
    color:#ffd84d;font-size:1.15em;white-space:nowrap;transform:translateX(-50%)}
  #aimtip.show{display:flex}
  #aimtip svg{width:3.2em;height:4.2em;shape-rendering:crispEdges;animation:swipe 1.6s ease-in-out infinite;
    filter:drop-shadow(.18em 0 0 #000) drop-shadow(-.18em 0 0 #000) drop-shadow(0 .18em 0 #000) drop-shadow(0 -.18em 0 #000)}
  @keyframes swipe{0%,100%{transform:translateX(-3.5em)}50%{transform:translateX(3.5em)}}
  #wrap.tut-aim #hint{visibility:hidden}
  @keyframes bob{to{transform:translateX(-50%) translateY(.7em)}}
  #hint{position:absolute;left:0;right:0;top:6%;text-align:center;font-size:.85em;line-height:1.7;color:#fff;opacity:.95}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 4% 4%;display:flex;flex-direction:column;gap:.9em;
    background:linear-gradient(#0000,#000a 40%)}
  #fx{display:flex;align-items:center;justify-content:center;gap:.8em;visibility:hidden}
  #fx button{padding:.6em .9em}
  #fxv{min-width:9em;text-align:center;font-size:.9em}
  .prow{display:flex;align-items:center;gap:.7em}
  .prow span{font-size:.8em}
  .pbar{position:relative;flex:1;height:1.8em;background:#111a;box-shadow:0 0 0 .2em #000,inset 0 0 0 .2em #fff3}
  #pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#4ad66d}
  .zone{position:absolute;top:0;bottom:0;border-left:.15em dashed #fff8;border-right:.15em dashed #fff8;left:55%;width:30%}
  .over{position:absolute;top:0;bottom:0;left:88%;right:0;background:repeating-linear-gradient(45deg,#e33a 0 .4em,#0000 .4em .8em)}
  #kick{font-size:1.25em;padding:1em;background:#c62f2f}
  #kick.hold{background:#ff6a1a}
  #cont{display:none;font-size:1.25em;padding:1em;background:#2f9e4f;animation:pulse .8s ease-in-out infinite alternate}
  @keyframes pulse{to{background:#45c46a}}
  #retry{display:none;font-size:1.25em;padding:1em;background:#d9731f;animation:pulse2 .8s ease-in-out infinite alternate}
  @keyframes pulse2{to{background:#f0913a}}
  /* balão de fala em pixel art: cantos em degraus e rabinho serrilhado recortados com clip-path;

  #say{position:absolute;max-width:62%;transform:translateX(-30%) scale(.3);transform-origin:30% 100%;opacity:0;

  #sayt{display:block;background:#fff;color:#15151f;padding:.8em .9em calc(.8em + 3*var(--u));
    --b:calc(100% - 3*var(--u));--l:24%;
    clip-path:polygon(0 calc(2*var(--u)),var(--u) calc(2*var(--u)),var(--u) var(--u),calc(2*var(--u)) var(--u),calc(2*var(--u)) 0,
      calc(100% - 2*var(--u)) 0,calc(100% - 2*var(--u)) var(--u),calc(100% - var(--u)) var(--u),calc(100% - var(--u)) calc(2*var(--u)),100% calc(2*var(--u)),
      100% calc(var(--b) - 2*var(--u)),calc(100% - var(--u)) calc(var(--b) - 2*var(--u)),calc(100% - var(--u)) calc(var(--b) - var(--u)),
      calc(100% - 2*var(--u)) calc(var(--b) - var(--u)),calc(100% - 2*var(--u)) var(--b),
      calc(var(--l) + 4*var(--u)) var(--b),calc(var(--l) + 4*var(--u)) calc(var(--b) + var(--u)),calc(var(--l) + 3*var(--u)) calc(var(--b) + var(--u)),
      calc(var(--l) + 3*var(--u)) calc(var(--b) + 2*var(--u)),calc(var(--l) + 2*var(--u)) calc(var(--b) + 2*var(--u)),calc(var(--l) + 2*var(--u)) 100%,

<script>
(() => {
'use strict';
// ---------- constantes do mundo (metros) ----------
const W = 180, H = 320, F = 280, HY = 138, CX = 90;
const R = 0.11, GW = 3.66, GH = 2.44, KZ = 0.4, WALLD = 9.15, RUN = 0.55;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * Math.random()); };
function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---------- câmera com perspectiva (olha da bola para o centro do gol) ----------
const cam = { x: 0, z: 18, h: 2.6, fx: 0, fz: -1, rx: 1, rz: 0 };
function proj(x, h, z) {
  const dx = x - cam.x, dz = z - cam.z, d = dx * cam.fx + dz * cam.fz;
  if (d < 0.2) return null;
  const l = dx * cam.rx + dz * cam.rz, s = F / d;
  return { x: CX + l * s, y: HY - (h - cam.h) * s, d, s };
}
const depth = (x, z) => (x - cam.x) * cam.fx + (z - cam.z) * cam.fz;

// ---------- sprites em pixel art ----------
function mk(rows, pal, outline = '#0a140c', sx = 0) {
  const h = rows.length, w = rows[0].length, c = document.createElement('canvas');
  c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < w; x++) {
      const ch = r[x];
      let col = pal[ch];
      if (ch === 'S') col = [2, 5, 6, 9].includes(x - sx) ? '#6cb4e6' : '#f4f4f4'; // listras albicelestes
      if (col) { g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1); }
    }
  });
  if (outline) {
    const cw = w + 2, chh = h + 2, d = g.getImageData(0, 0, cw, chh).data, o = new Uint8Array(cw * chh);
    for (let i = 0; i < o.length; i++) o[i] = d[i * 4 + 3] > 0 ? 1 : 0;
    g.fillStyle = outline;
    for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
      if (o[y * cw + x]) continue;
      if ((x > 0 && o[y * cw + x - 1]) || (x < cw - 1 && o[y * cw + x + 1]) ||
          (y > 0 && o[(y - 1) * cw + x]) || (y < chh - 1 && o[(y + 1) * cw + x])) g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

// Jogador da barreira

function flipX(src) {

// Bola (2 quadros de giro)
const BP = { w: '#ffffff', k: '#222222' };
const ballSpr = [
  mk(['..wwww..', '.wwkkww.', 'wwwkkwww', 'wkwwwwkw', 'wkwwwwkw', 'wwwkkwww', '.wwwwww.', '..wwww..'], BP, '#111'),
  mk(['..wwww..', '.wwwwww.', 'wkwwwwkw', 'wwwkkwww', 'wwwkkwww', 'wkwwwwkw', '.wwwwww.', '..wwww..'], BP, '#111')
];

function drawSpr(spr, sx, syFeet, scale) {
  const w = Math.max(1, Math.round(spr.width * scale)), h = Math.max(1, Math.round(spr.height * scale));

function stepBall(dt) {
  const n = 6, h = dt / n;

    if (fl && !fl.done) {

      const s = Math.min(1, fl.t / fl.dur), P = pathPos(s);
      ball.spin += h * 20;
      if (!fl.wallChecked) {
        const along = (P.x - B.x) * cam.fx + (P.z - B.z) * cam.fz;
        if (along >= WALLD) {
          fl.wallChecked = true;
          const lat = (P.x - B.x) * cam.rx + (P.z - B.z) * cam.rz;
          if (lat > wallSpan[0] - R && lat < wallSpan[1] + R && P.h < wallTop() + R * 0.5) {
            const v = pathVel(s);
            Object.assign(ball, P, { vx: -v.x * 0.2 + rnd(-2, 2), vz: -v.z * 0.25, vh: Math.abs(v.h) * 0.3 + 2 });
            fl.done = true; result('barreira'); continue;
          }
        }
      }
      if (!fl.kChecked && P.z <= KZ) {
        fl.kChecked = true;
        if (keeperHit(P)) {
          const v = pathVel(s);
          Object.assign(ball, P);
          fl.done = true;
          if (K.mode !== 'dive' && Math.abs(P.x - K.x) < 0.5 && P.h > 0.5 && P.h < 1.7) ball.caught = true;
          else Object.assign(ball, { vx: (P.x - kbox().x) * 3 + rnd(-2, 2), vz: Math.abs(v.z) * 0.25 + rnd(2, 4), vh: rnd(1.5, 4) });

        }
      }
      if (s >= 1) {
        const v = pathVel(1);
        Object.assign(ball, P, { vx: v.x, vz: v.z, vh: v.h });
        fl.done = true;
        const ax = Math.abs(P.x);
        if (ax < GW - R && P.h < GH - R) { S.inNet = true; result('gol'); }
        else if ((Math.abs(ax - GW) < R + 0.07 && P.h < GH + R) || (Math.abs(P.h - GH) < R + 0.07 && ax < GW + R)) {

  if (S.state !== 'aim') return;
  S.state = 'power'; S.power = 0; S.pdir = 1;
  kickDone();
  kickBtn.classList.add('hold'); kickBtn.textContent = 'SOLTE!';
  $('hint').innerHTML = 'SOLTE NA FORÇA CERTA!<br>VERDE = IDEAL';
}
function releaseKick() {
  kickBtn.classList.remove('hold'); kickBtn.textContent = 'SEGURE P/ CHUTAR';
  if (S.state === 'power') release();
}
kickBtn.addEventListener('pointerdown', e => { e.preventDefault(); try { kickBtn.setPointerCapture(e.pointerId); } catch (_) {} pressKick(); });
kickBtn.addEventListener('pointerup', releaseKick);
kickBtn.addEventListener('pointercancel', releaseKick);
kickBtn.addEventListener('contextmenu', e => e.preventDefault());

$('fxl').addEventListener('click', () => { if (S.state === 'aim') { S.curve = Math.max(-2, S.curve - 1); updHUD(); } });
$('fxr').addEventListener('click', () => { if (S.state === 'aim') { S.curve = Math.min(2, S.curve + 1); updHUD(); } });

const keys = {};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) pressKick(); return; }
  keys[e.code] = true;
});
addEventListener('keyup', e => { if (e.code === 'Space') releaseKick(); keys[e.code] = false; });
setInterval(() => {
  if (S.state !== 'aim' && S.state !== 'power') return;
  if (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown) aimDone();
  if (keys.ArrowLeft) S.aim.x = clamp(S.aim.x - 0.08, -5, 5);
  if (keys.ArrowRight) S.aim.x = clamp(S.aim.x + 0.08, -5, 5);
  if (keys.ArrowUp) S.aim.h = clamp(S.aim.h + 0.06, R, 3.4);
  if (keys.ArrowDown) S.aim.h = clamp(S.aim.h - 0.06, R, 3.4);
}, 16);

// tutorial do primeiro chute: a mãozinha ensina a arrastar para mirar e, depois que o jogador mira,
// a seta aponta o botão de chutar; tudo some no primeiro chute
let aimOn = !store.get('messi-tut-aim'), tipOn = !store.get('messi-tutorial'), tutDrag = 0;
const tutOn = () => aimOn || tipOn;
const HAND = ['...xx....', '...xx....', '...xx....', '...xxxx..', '...xxxxxx', '.x.xxxxxx',
  '.xxxxxxxx', '.xxxxxxxx', '..xxxxxxx', '..xxxxxx.', '...xxxxx.', '...xxxxx.'];
$('aimtip').querySelector('svg').innerHTML = HAND.map((r, y) => [...r].map((c, x) =>
  c === 'x' ? `<rect x="${x}" y="${y}" width="1" height="1" fill="#fff"/>` : '').join('')).join('');
function placeTip() {
  const t = $('tip'), kr = kickBtn.getBoundingClientRect(), wr = $('wrap').getBoundingClientRect();
  t.style.top = (kr.top - wr.top - t.offsetHeight - 2) + 'px';
}
function showTut() {
  $('aimtip').classList.toggle('show', aimOn);
  $('wrap').classList.toggle('tut-aim', aimOn);
  $('tip').classList.toggle('show', !aimOn && tipOn);
  if (!aimOn && tipOn) placeTip();
}
function aimDone() { if (!aimOn) return; aimOn = false; store.set('messi-tut-aim', 1); showTut(); }
function kickDone() {
  if (!tutOn()) return;
  aimOn = tipOn = false; S.shotT = S.time;
  store.set('messi-tut-aim', 1); store.set('messi-tutorial', 1); showTut();
}
function fit() { const w = $('wrap').clientWidth; $('wrap').style.fontSize = (w / 40) + 'px'; if (tipOn && !aimOn) placeTip(); }
addEventListener('resize', fit);
document.addEventListener('gesturestart', e => e.preventDefault());

fit();
showTut();
newShot();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
